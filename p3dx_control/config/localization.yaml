# robot_localization ekf_node configuration (ROS 2 port of the original ROS 1
# ekf_localization_node params, see git history of this file).
# Fuses wheel odometry (gz DiffDrive plugin, RosAria/odom) with the IMU.
# Reference: https://github.com/cra-ros-pkg/robot_localization/blob/humble-devel/params/ekf.yaml
#
# The state vector config matrices are 15 values ordered:
#   x,     y,      z,
#   roll,  pitch,  yaw,
#   vx,    vy,     vz,
#   vroll, vpitch, vyaw,
#   ax,    ay,     az
ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 50.0
    two_d_mode: true

    map_frame: <tf_prefix>map              # Defaults to "map" if unspecified
    odom_frame: <tf_prefix>odom            # Defaults to "odom" if unspecified
    base_link_frame: <tf_prefix>base_link  # Defaults to "base_link" if unspecified
    world_frame: <tf_prefix>odom           # odom -> the EKF publishes the odom->base_link TF

    # Whether to broadcast the transformation over the /tf topic.
    publish_tf: true

    # wheel encoder odometry: fuse planar velocities (vx, vy, vyaw)
    odom0: RosAria/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # IMU: fuse orientation, angular velocity and linear acceleration
    imu0: imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
